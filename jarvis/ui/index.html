<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Джарвис</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --c: 57, 198, 255; }
  html, body { margin: 0; height: 100%; background: #02050a; overflow: hidden;
    font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; color: rgb(var(--c)); user-select: none; }
  canvas { display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .corner { position: absolute; width: 34px; height: 34px; border: 2px solid rgba(var(--c), .55); }
  .tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
  .title { position: absolute; top: 24px; left: 0; right: 0; text-align: center; }
  .title b { display: block; font-size: 22px; letter-spacing: 10px; font-weight: 600;
    text-shadow: 0 0 12px rgba(var(--c), .9); }
  .title span { font-size: 10px; letter-spacing: 4px; opacity: .6; }
  .clock { position: absolute; top: 28px; right: 34px; font-size: 12px; letter-spacing: 2px; opacity: .7; }
  .sys { position: absolute; top: 28px; left: 34px; font-size: 10px; letter-spacing: 2px; opacity: .55; line-height: 1.6; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
    background: linear-gradient(to bottom, rgba(2,5,10,0), rgba(2,5,10,.85) 45%); }
  .status { position: absolute; bottom: 104px; left: 0; right: 0; text-align: center; font-size: 13px;
    letter-spacing: 5px; text-transform: uppercase; }
  .status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--c));
    box-shadow: 0 0 10px rgb(var(--c)); margin-right: 10px; vertical-align: 1px; }
  .eq { position: absolute; bottom: 68px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px;
    align-items: center; height: 30px; }
  .eq div { width: 4px; border-radius: 2px; background: rgb(var(--c)); box-shadow: 0 0 6px rgba(var(--c), .8); }
  .sub { position: absolute; bottom: 26px; left: 40px; right: 40px; text-align: center; color: #dff3ff;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.35;
    text-shadow: 0 0 8px rgba(var(--c), .6); max-height: 54px; overflow: hidden; }
  .fade { transition: opacity .6s; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<div class="hud fade" id="hud">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="band"></div>
  <div class="sys" id="sys">СВЯЗЬ: ОК<br>ИИ: ЛОКАЛЬНО<br>ГОЛОС: АКТИВЕН</div>
  <div class="title"><b>ДЖАРВИС</b><span>ЦЕНТР УПРАВЛЕНИЯ</span></div>
  <div class="clock" id="clock"></div>
  <div class="status"><i></i><span id="status">ОЖИДАНИЕ</span></div>
  <div class="eq" id="eq"></div>
  <div class="sub" id="sub"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
