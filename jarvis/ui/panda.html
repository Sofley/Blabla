<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Джарвис</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --c: 60, 120, 170; }
  html, body { margin: 0; height: 100%; background: #f3ecdc; overflow: hidden; user-select: none;
    font-family: "Georgia", "Times New Roman", serif; color: #3b2f25; }
  canvas { display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .6s; }
  .clock { position: absolute; top: 18px; right: 22px; font-size: 12px; letter-spacing: 3px; opacity: .55; }
  .sys { position: absolute; top: 18px; left: 22px; font-size: 11px; letter-spacing: 3px; opacity: .5; }
  .name { position: absolute; bottom: 112px; left: 0; right: 0; text-align: center; color: #fff;
    font-size: 26px; letter-spacing: 16px; text-indent: 16px; text-shadow: 0 1px 8px rgba(20,50,80,.5); }
  .status { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center; font-size: 11px;
    letter-spacing: 6px; text-transform: uppercase; color: #fff; opacity: .85; text-shadow: 0 1px 4px rgba(20,50,80,.6); }
  .eq { position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px;
    align-items: center; height: 26px; }
  .eq div { width: 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 4px rgba(20,50,80,.4); }
  .sub { position: absolute; bottom: 16px; left: 28px; right: 28px; text-align: center; color: #2c2a28;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.35; max-height: 44px; overflow: hidden;
    background: rgba(243,236,220,.85); border-radius: 10px; padding: 4px 8px; }
  .sub:empty { display: none; }
  .pick { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 18px; font-family: "Segoe UI", system-ui, sans-serif; text-align: center; padding: 30px; }
  .pick label { background: #3c6e9a; color: #fff; font-size: 20px; padding: 18px 30px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(20,50,80,.3); }
  .pick input { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<div class="hud" id="hud">
  <div class="sys">МАСТЕР НА СВЯЗИ</div>
  <div class="clock" id="clock"></div>
  <div class="status"><span id="status">ожидание</span></div>
  <div class="eq" id="eq"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="pick" id="pick">
  <div>Выберите картинку, которую нужно оживить</div>
  <label>Выбрать картинку…<input type="file" id="file" accept="image/*"></label>
  <div style="opacity:.6;font-size:13px">или положите её в папку jarvis/ui/user под именем poster.jpg</div>
</div>
<script type="module" src="./panda.js"></script>
</body>
</html>
