<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подсказки — что можно сказать</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #070b12; --panel: #0e1520; --fg: #e6f0f8; --muted: #8aa0b4; --accent: #39c6ff; --ok: #4fe3a0; --bad: #ff8a7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; }
  body { display: flex; flex-direction: column; padding: 14px 16px; box-sizing: border-box; gap: 12px; overflow: hidden; }
  h1 { margin: 0; font-family: "Bahnschrift", "Segoe UI", sans-serif; font-size: 17px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; line-height: 1.4; margin: 0; }
  .heard { background: var(--panel); border-radius: 10px; padding: 10px 12px; border-left: 3px solid var(--muted); }
  .heard.ok { border-left-color: var(--ok); }
  .heard.bad { border-left-color: var(--bad); }
  .heard .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .heard .txt { font-size: 16px; margin-top: 3px; min-height: 20px; }
  .ai { font-size: 12px; color: var(--muted); }
  .ai b { color: var(--fg); font-weight: 600; }
  .list { overflow-y: auto; display: grid; gap: 12px; padding-right: 4px; flex: 1; }
  .grp h2 { margin: 0 0 5px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .grp ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .grp li { padding: 4px 8px; border-radius: 6px; background: var(--panel); line-height: 1.3; }
  .grp li::before { content: "«"; color: var(--muted); }
  .grp li::after { content: "»"; color: var(--muted); }
  .grp li.hit { outline: 1px solid var(--ok); }
</style>
</head>
<body>
  <h1>Что можно сказать</h1>
  <p class="note">Начните с «Джарвис» и говорите своими словами — это только примеры, заучивать не нужно.</p>
  <div class="heard" id="heard"><div class="lbl">Вы сказали</div><div class="txt" id="heard-txt">—</div></div>
  <div class="ai" id="ai"></div>
  <div class="list" id="list"></div>
<script>
  const list = document.getElementById('list');
  fetch('/hints.json').then(r => r.json()).then(groups => {
    for (const [title, items] of groups) {
      const g = document.createElement('div'); g.className = 'grp';
      g.innerHTML = '<h2></h2><ul></ul>';
      g.querySelector('h2').textContent = title;
      for (const it of items) { const li = document.createElement('li'); li.textContent = it; g.querySelector('ul').appendChild(li); }
      list.appendChild(g);
    }
  }).catch(() => {});
  let lastId = -1;
  setInterval(async () => {
    try {
      const s = await (await fetch('/state', { cache: 'no-store' })).json();
      const h = s.heard || {};
      if (h.id !== lastId) {
        lastId = h.id;
        const box = document.getElementById('heard');
        document.getElementById('heard-txt').textContent = h.text ? '«' + h.text + '»' + (h.ok ? '  ✓ понял' : '  ✗ не понял, скажите иначе') : '—';
        box.className = 'heard' + (h.text ? (h.ok ? ' ok' : ' bad') : '');
      }
      document.getElementById('ai').innerHTML = s.ai
        ? 'ИИ: <b>подключён</b> — можно просить что угодно и задавать любые вопросы.'
        : 'ИИ: <b>не подключён</b> — работают команды вроде этих, вопросы Джарвис ищет в интернете.';
    } catch (e) {}
  }, 300);
</script>
</body>
</html>
