# Codemagic: codemagic.io → Add application → this repo → workflow "Android APK".
workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.9
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Build APK
        # Test build. For releases add the keystore in Codemagic (Code signing
        # identities) and set NEXUS_KEYSTORE_PATH / passwords instead.
        script: NEXUS_ALLOW_DEBUG_SIGNING=1 flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
