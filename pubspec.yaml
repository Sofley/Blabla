name: b2b_contracts
description: "NexusTrade — back-to-back foreign trade contracts: Buyer ⇄ Intermediary ⇄ Seller, profit calculator, CBU/PBOC rates, logistics tariffs, deal chat."
publish_to: 'none'
version: 3.0.0+6

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  excel: ^4.0.6
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.12.0
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  timezone: ^0.10.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/brand/logo.png
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/icon_full.png
  adaptive_icon_background: "#0C2445"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 24
