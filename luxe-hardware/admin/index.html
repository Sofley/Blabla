<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Статистика — Luxe Hardware</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <div>
        <p class="eyebrow">Luxe Hardware</p>
        <h1>Статистика сайта</h1>
      </div>
      <div class="top__controls">
        <div class="period" id="period" role="tablist" aria-label="Период">
          <button data-d="1">Сегодня</button>
          <button data-d="7">7 дней</button>
          <button data-d="30" class="is-active">30 дней</button>
          <button data-d="90">90 дней</button>
        </div>
        <a class="btn" href="/admin/products.html">Товары</a>
        <a class="btn" href="/admin/api/leads.csv">Заявки в CSV</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis"></section>

    <section class="panel panel--wide">
      <div class="panel__head"><h2>Визиты и заявки по дням</h2><span class="legend"><i class="lg lg--a"></i>визиты <i class="lg lg--b"></i>заявки</span></div>
      <div id="chart" class="chart"></div>
    </section>

    <div class="cols">
      <section class="panel">
        <div class="panel__head"><h2>Откуда приходят</h2><span class="hint">визиты · заявки</span></div>
        <div id="sources"></div>
      </section>
      <section class="panel">
        <div class="panel__head"><h2>Что делают на сайте</h2></div>
        <div id="clicks"></div>
      </section>
    </div>

    <div class="cols cols--3">
      <section class="panel">
        <div class="panel__head"><h2>Интерес к товарам</h2><span class="hint">открытия карточек</span></div>
        <div id="products"></div>
      </section>
      <section class="panel">
        <div class="panel__head"><h2>Устройства</h2></div>
        <div id="devices"></div>
      </section>
      <section class="panel">
        <div class="panel__head"><h2>Регион</h2><span class="hint">по часовому поясу</span></div>
        <div id="regions"></div>
      </section>
    </div>

    <div class="cols">
      <section class="panel">
        <div class="panel__head"><h2>Кампании (utm_campaign)</h2></div>
        <div id="campaigns"></div>
      </section>
      <section class="panel">
        <div class="panel__head"><h2>Другие сайты</h2><span class="hint">домены-источники</span></div>
        <div id="referrers"></div>
      </section>
    </div>

    <section class="panel panel--wide">
      <div class="panel__head"><h2>Последние заявки</h2></div>
      <div class="table-wrap"><table class="table" id="leads"></table></div>
    </section>

    <p class="foot" id="foot"></p>
  </main>
</body>
</html>
