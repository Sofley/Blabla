# Builds the APK on GitHub itself: Actions tab → "Build APK" → Run workflow,
# then download "B2B-Ledger-apk" from the finished run (works from a phone).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Permanent key from repository secrets (Settings > Secrets > Actions):
      # NEXUS_KEYSTORE_BASE64, NEXUS_STORE_PASSWORD, NEXUS_KEY_PASSWORD, NEXUS_KEY_ALIAS.
      # Without them the build is a TEST build signed with a throwaway debug key.
      - name: Restore signing key
        env:
          KS: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "NEXUS_ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release
        env:
          NEXUS_STORE_PASSWORD: ${{ secrets.NEXUS_STORE_PASSWORD }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        with:
          name: NexusTrade-apk
          path: build/app/outputs/flutter-apk/app-release.apk
