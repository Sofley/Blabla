# Публикует сайт Marvan (папка luxe-hardware/public) на GitHub Pages.
# Включить один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Сайт Marvan → GitHub Pages

on:
  push:
    branches: [main, claude/fervent-turing-klz9vb]
    paths: ['luxe-hardware/public/**', '.github/workflows/luxe-site-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: luxe-hardware/public
      - id: deployment
        uses: actions/deploy-pages@v4
